<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PlaceMate – Student Placement Management System</title>
<meta name="description" content="PlaceMate helps colleges run campus placements: post drives, let students apply, and track every application from applied to offer.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎓%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#14182b;--mu:#5d647c;--bd:#e3e6f0;--ac:#4f46e5;--ac2:#eef0ff;--ok:#14804a;--okb:#e1f6ea;--wn:#a35b00;--wnb:#fff1d6;--er:#b42318;--erb:#fde6e3;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0e1020;--card:#171a30;--tx:#eceefb;--mu:#98a0c0;--bd:#2a2e4a;--ac:#8b85ff;--ac2:#23264a;--ok:#5fd99a;--okb:#12301f;--wn:#ffc15e;--wnb:#33260c;--er:#ff8f84;--erb:#3a1511;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;flex-direction:column}
a{color:var(--ac);text-decoration:none}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--bd)}
.wrap{max-width:1100px;margin:auto;padding:0 16px;width:100%}
.bar{display:flex;gap:10px;align-items:center;padding:12px 0;flex-wrap:wrap}
.logo{font-weight:800;font-size:18px;color:var(--tx);display:flex;gap:8px;align-items:center}
.logo i{font-style:normal;background:var(--ac);color:#fff;border-radius:8px;padding:2px 8px}
.sp{flex:1}
main{flex:1;padding:24px 0 48px}
h1{font-size:26px;margin:0 0 4px}h2{font-size:17px;margin:0 0 12px}
.sub{color:var(--mu);margin:0 0 18px}
.grid{display:grid;gap:14px}
.stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
.stat b{display:block;font-size:28px;line-height:1.1}.stat span{color:var(--mu);font-size:13px}
.hero{text-align:center;padding:56px 0 36px}
.hero h1{font-size:clamp(30px,6vw,48px);line-height:1.1;max-width:720px;margin:0 auto 14px}
.hero p{color:var(--mu);max-width:560px;margin:0 auto 24px;font-size:17px}
.hero .btn{margin:4px;padding:11px 22px}
.feat{grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin:12px 0 36px}
.feat .card b{display:block;margin:6px 0 4px}.feat .card span{color:var(--mu);font-size:14px}
.two{grid-template-columns:2fr 1fr}
@media(max-width:800px){.two{grid-template-columns:1fr}}
.tabs{display:flex;gap:6px;margin-bottom:18px;overflow-x:auto}
.tabs button{border:1px solid var(--bd);background:var(--card);color:var(--mu);padding:7px 16px;border-radius:99px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px 10px;min-width:0;width:100%}
.tools input,.tools select{width:auto}.tools input[type=search]{flex:1;min-width:160px}
.drive{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.co{font-weight:700;font-size:16px}.meta{color:var(--mu);font-size:13px;margin-top:2px}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:99px;padding:2px 9px;background:var(--ac2);color:var(--ac);margin:6px 6px 0 0}
.tag.ok{background:var(--okb);color:var(--ok)}.tag.wn{background:var(--wnb);color:var(--wn)}.tag.er{background:var(--erb);color:var(--er)}
.btn{border:0;background:var(--ac);color:#fff;font:inherit;font-weight:600;padding:8px 16px;border-radius:10px;cursor:pointer;display:inline-block}
.btn:disabled{background:var(--bd);color:var(--mu);cursor:not-allowed}
.btn.g{background:var(--ac2);color:var(--ac)}.btn.d{background:var(--erb);color:var(--er)}
.steps{display:flex;gap:4px;margin-top:8px}.steps i{flex:1;height:5px;border-radius:9px;background:var(--bd)}.steps i.d{background:var(--ac)}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-weight:600;font-size:12px;text-transform:uppercase}
td select{width:auto}
.bars div{display:grid;grid-template-columns:90px 1fr 28px;gap:8px;align-items:center;margin:8px 0;font-size:13px}
.bars span{height:10px;border-radius:9px;background:var(--ac)}.bars em{font-style:normal;color:var(--mu)}
form.f{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
form.f label{display:grid;gap:4px;font-size:13px;color:var(--mu)}
.auth{max-width:440px;margin:24px auto}.auth form.f{grid-template-columns:1fr 1fr}
.auth form.f .w{grid-column:1/-1}
.err{color:var(--er);font-size:13px;min-height:18px}
.hint{background:var(--ac2);color:var(--ac);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:14px}
footer{border-top:1px solid var(--bd);color:var(--mu);font-size:13px;padding:18px 0;text-align:center}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:20}
.toast.s{opacity:1}
</style>
</head>
<body>
<header><div class="wrap bar" id="nav"></div></header>
<main><div class="wrap" id="app"></div></main>
<footer><div class="wrap">© 2026 PlaceMate · Student Placement Management System</div></footer>
<div class="toast" id="t"></div>

<script>
var STAGES=["Applied","Shortlisted","Interview","Selected","Rejected"];
var BR=["CSE","CSE (AI/ML)","IT","ECE","EEE","Mechanical","Civil","MBA"];
var db,me=null,tab="";
function seed(){return{users:[{id:"a1",role:"admin",name:"Placement Cell",email:"admin@college.edu",pw:"admin123"}],
drives:[
{id:"d1",co:"TCS",role:"Digital Engineer",pkg:7,cgpa:6.5,type:"Full-time",dl:"2026-11-15"},
{id:"d2",co:"Infosys",role:"Systems Engineer",pkg:6.5,cgpa:6.5,type:"Full-time",dl:"2026-11-20"},
{id:"d3",co:"Google STEP",role:"Software Intern",pkg:12,cgpa:8.5,type:"Internship",dl:"2026-11-10"},
{id:"d4",co:"Wipro",role:"Project Engineer",pkg:6,cgpa:6,type:"Full-time",dl:"2026-12-01"},
{id:"d5",co:"Zomato",role:"ML Intern",pkg:9,cgpa:7.5,type:"Internship",dl:"2026-11-25"}],apps:[]}}
function load(){try{db=JSON.parse(localStorage.getItem("pm_db"))}catch(e){}if(!db||!db.users)db=seed()}
function save(){try{localStorage.setItem("pm_db",JSON.stringify(db))}catch(e){}}
function sess(){try{return localStorage.getItem("pm_me")}catch(e){return null}}
function setSess(v){try{v?localStorage.setItem("pm_me",v):localStorage.removeItem("pm_me")}catch(e){}}
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function uid(){return Math.random().toString(36).slice(2,10)}
function dr(id){return db.drives.filter(function(d){return d.id==id})[0]}
function us(id){return db.users.filter(function(u){return u.id==id})[0]}
function fd(s){return new Date(s).toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"})}
function today(){return new Date().toISOString().slice(0,10)}
function cls(i){return i==3?"ok":i==4?"er":i==0?"":"wn"}
function toast(m){var t=$("t");t.textContent=m;t.className="toast s";setTimeout(function(){t.className="toast"},2000)}
function stat(n,l){return '<div class="card stat"><b>'+n+'</b><span>'+l+'</span></div>'}
function tabs(list){return '<div class="tabs">'+list.map(function(t){return '<button data-tab="'+t+'" class="'+(tab==t?"on":"")+'">'+t+'</button>'}).join("")+'</div>'}

function nav(){
$("nav").innerHTML='<a class="logo" href="#/"><i>P</i>PlaceMate</a><span class="sp"></span>'+(me?
'<span class="meta">'+esc(me.name)+' · '+me.role+'</span><a class="btn g" href="#/dashboard">Dashboard</a><button class="btn d" data-act="out">Log out</button>':
'<a href="#/login" class="btn g">Log in</a><a href="#/register" class="btn">Register</a>')}

function landing(){
var st=db.users.filter(function(u){return u.role=="student"}).length;
return '<section class="hero"><h1>Campus placements, organised in one place.</h1><p>Colleges post drives, students apply in a click, and everyone tracks progress from application to offer.</p><a class="btn" href="#/register">Create student account</a><a class="btn g" href="#/login">Placement cell login</a></section>'+
'<div class="grid stats">'+stat(db.drives.length,"Live drives")+stat(st,"Students registered")+stat(db.apps.length,"Applications")+stat(db.apps.filter(function(a){return a.st==3}).length,"Offers")+'</div>'+
'<h2>Why PlaceMate</h2><div class="grid feat">'+[["🎯","Smart eligibility","CGPA rules are checked automatically so students only apply where they qualify."],["📈","Live tracking","Applied, Shortlisted, Interview, Selected: every stage is visible to the student."],["🗂️","One dashboard","Placement officers post drives, review applicants and export reports as CSV."],["📱","Works everywhere","Responsive layout with light and dark themes for phones and desktops."]].map(function(f){return '<div class="card"><div style="font-size:26px">'+f[0]+'</div><b>'+f[1]+'</b><span>'+f[2]+'</span></div>'}).join("")+'</div>'}

function login(){return '<div class="card auth"><h1>Log in</h1><p class="sub">Access your placement portal.</p><form class="f" id="lf" style="grid-template-columns:1fr"><label>Email<input type="email" id="le" required autocomplete="username"></label><label>Password<input type="password" id="lp" required autocomplete="current-password"></label><div class="err" id="er"></div><button class="btn">Log in</button></form><div class="hint">Demo placement cell login: admin@college.edu / admin123</div><p class="meta">New student? <a href="#/register">Create an account</a></p></div>'}
function register(){return '<div class="card auth" style="max-width:560px"><h1>Student registration</h1><p class="sub">Create your placement profile.</p><form class="f" id="rf"><label class="w">Full name<input id="rn" required></label><label>Roll number<input id="rr" required></label><label>Branch<select id="rb">'+BR.map(function(b){return '<option>'+b+'</option>'}).join("")+'</select></label><label>CGPA<input id="rc" type="number" step="0.01" min="0" max="10" required></label><label>Email<input id="re" type="email" required autocomplete="username"></label><label class="w">Password (min 6 characters)<input id="rp" type="password" minlength="6" required autocomplete="new-password"></label><div class="err w" id="er"></div><button class="btn w">Create account</button></form><p class="meta">Already registered? <a href="#/login">Log in</a></p></div>'}

function driveCard(d,ap){var ok=me.cgpa>=d.cgpa,late=d.dl<today();
return '<div class="card drive"><div><div class="co">'+esc(d.co)+' · '+esc(d.role)+'</div><div class="meta">Apply by '+fd(d.dl)+'</div><span class="tag">₹'+esc(d.pkg)+' LPA</span><span class="tag">'+esc(d.type)+'</span><span class="tag '+(ok?"ok":"er")+'">Min CGPA '+esc(d.cgpa)+(ok?" ✓":" ✗")+'</span></div><button class="btn" data-apply="'+d.id+'" '+(ap||!ok||late?"disabled":"")+'>'+(ap?"Applied":late?"Closed":ok?"Apply":"Not eligible")+'</button></div>'}

var F={q:"",t:"",e:""};
function student(){
tab=tab||"Drives";var m=db.apps.filter(function(a){return a.uid==me.id});
var body="";
if(tab=="Drives"){
var l=db.drives.filter(function(d){return(!F.q||(d.co+d.role).toLowerCase().indexOf(F.q.toLowerCase())>-1)&&(!F.t||d.type==F.t)&&(!F.e||me.cgpa>=d.cgpa)});
body='<div class="tools"><input type="search" id="fq" placeholder="Search company or role…" value="'+esc(F.q)+'"><select id="ft"><option value="">All types</option><option'+(F.t=="Full-time"?" selected":"")+'>Full-time</option><option'+(F.t=="Internship"?" selected":"")+'>Internship</option></select><select id="fe"><option value="">All eligibility</option><option value="y"'+(F.e?" selected":"")+'>Eligible for me</option></select></div>'+(l.length?l.map(function(d){return driveCard(d,m.some(function(a){return a.did==d.id}))}).join(""):'<div class="card meta">No drives match your filters.</div>')}
else if(tab=="My applications"){
body=m.length?m.map(function(a){var d=dr(a.did);if(!d)return"";return '<div class="card" style="margin-bottom:12px"><div class="co">'+esc(d.co)+' · '+esc(d.role)+'</div><div class="meta">Applied on '+fd(a.on)+'</div><span class="tag '+cls(a.st)+'">'+STAGES[a.st]+'</span><div class="steps">'+[0,1,2,3].map(function(i){return '<i class="'+(a.st<4&&i<=a.st?"d":"")+'"></i>'}).join("")+'</div></div>'}).join(""):'<div class="card meta">You have not applied to any drive yet.</div>'}
else{
body='<div class="card"><form class="f" id="pf"><label>Full name<input id="pn" value="'+esc(me.name)+'" required></label><label>Roll number<input id="pr" value="'+esc(me.roll)+'" required></label><label>Branch<select id="pb">'+BR.map(function(b){return '<option'+(b==me.branch?" selected":"")+'>'+b+'</option>'}).join("")+'</select></label><label>CGPA<input id="pc" type="number" step="0.01" min="0" max="10" value="'+esc(me.cgpa)+'" required></label><label>Phone<input id="pp" value="'+esc(me.phone||"")+'"></label><label>Resume link<input id="pl" type="url" placeholder="https://" value="'+esc(me.resume||"")+'"></label><label style="align-self:end"><button class="btn">Save profile</button></label></form></div>'}
return '<h1>Student dashboard</h1><p class="sub">'+esc(me.branch)+' · CGPA '+esc(me.cgpa)+' · Roll '+esc(me.roll)+'</p><div class="grid stats">'+stat(db.drives.length,"Open drives")+stat(db.drives.filter(function(d){return me.cgpa>=d.cgpa}).length,"Eligible for you")+stat(m.length,"Applications")+stat(m.filter(function(a){return a.st==3}).length,"Offers")+'</div>'+tabs(["Drives","My applications","Profile"])+body}

function admin(){
tab=tab||"Overview";var sel=db.apps.filter(function(a){return a.st==3}).length,body="";
if(tab=="Overview"){
var by={};db.apps.forEach(function(a){var d=dr(a.did);if(a.st==3&&d)by[d.co]=(by[d.co]||0)+1});var ks=Object.keys(by);
body='<div class="grid two"><div class="card"><h2>Selections by company</h2><div class="bars">'+(ks.length?ks.map(function(k){return '<div><em>'+esc(k)+'</em><span style="width:'+Math.min(by[k]*40,100)+'%"></span><b>'+by[k]+'</b></div>'}).join(""):'<div class="meta">No selections yet.</div>')+'</div></div><div class="card"><h2>Applications by status</h2><div class="bars">'+STAGES.map(function(s,i){var n=db.apps.filter(function(a){return a.st==i}).length;return '<div><em>'+s+'</em><span style="width:'+Math.min(n*25,100)+'%"></span><b>'+n+'</b></div>'}).join("")+'</div></div></div>'}
else if(tab=="Drives"){
body='<div class="card" style="margin-bottom:14px"><h2>Post a new drive</h2><form class="f" id="nf"><label>Company<input id="nc" required></label><label>Role<input id="nr" required></label><label>Package (LPA)<input id="np" type="number" step="0.1" min="0" required></label><label>Min. CGPA<input id="ng" type="number" step="0.1" min="0" max="10" value="6" required></label><label>Type<select id="nt"><option>Full-time</option><option>Internship</option></select></label><label>Deadline<input id="nd" type="date" required></label><label style="align-self:end"><button class="btn">Publish drive</button></label></form></div>'+
db.drives.map(function(d){var n=db.apps.filter(function(a){return a.did==d.id}).length;return '<div class="card drive"><div><div class="co">'+esc(d.co)+' · '+esc(d.role)+'</div><div class="meta">Deadline '+fd(d.dl)+' · '+n+' applicant(s)</div><span class="tag">₹'+esc(d.pkg)+' LPA</span><span class="tag">'+esc(d.type)+'</span><span class="tag">Min CGPA '+esc(d.cgpa)+'</span></div><button class="btn d" data-del="'+d.id+'">Delete</button></div>'}).join("")}
else if(tab=="Analytics"){body=analytics()}
else{
body='<div class="tools"><button class="btn g" data-act="csv">Export CSV</button></div><div class="card tbl"><table><thead><tr><th>Student</th><th>Roll no.</th><th>Branch</th><th>CGPA</th><th>Drive</th><th>Status</th><th>Update</th></tr></thead><tbody>'+(db.apps.length?db.apps.map(function(a){var u=us(a.uid),d=dr(a.did);if(!u||!d)return"";return '<tr><td>'+esc(u.name)+'</td><td>'+esc(u.roll)+'</td><td>'+esc(u.branch)+'</td><td>'+esc(u.cgpa)+'</td><td>'+esc(d.co)+'</td><td><span class="tag '+cls(a.st)+'" style="margin:0">'+STAGES[a.st]+'</span></td><td><select data-st="'+a.id+'">'+STAGES.map(function(s,i){return '<option value="'+i+'"'+(i==a.st?" selected":"")+'>'+s+'</option>'}).join("")+'</select></td></tr>'}).join(""):'<tr><td colspan="7" class="meta">No applications yet.</td></tr>')+'</tbody></table></div>'}
return '<h1>Placement cell dashboard</h1><p class="sub">Manage drives, review applicants and monitor progress.</p><div class="grid stats">'+stat(db.drives.length,"Active drives")+stat(db.users.filter(function(u){return u.role=="student"}).length,"Students")+stat(db.apps.length,"Applications")+stat(sel,"Selected")+'</div>'+tabs(["Overview","Analytics","Drives","Applicants"])+body}

function bar(rows,sfx){var mx=Math.max.apply(null,rows.map(function(r){return r[1]}).concat([1]));
return '<div class="bars">'+rows.map(function(r){return '<div><em>'+esc(r[0])+'</em><span style="width:'+Math.round(r[1]/mx*100)+'%"></span><b>'+r[1]+(sfx||"")+'</b></div>'}).join("")+'</div>'}
function analytics(){
var S=db.users.filter(function(u){return u.role=="student"}),A=db.apps;
var off=A.filter(function(a){return a.st==3&&dr(a.did)}),placed={};
off.forEach(function(a){placed[a.uid]=1});var np=Object.keys(placed).length;
var pk=off.map(function(a){return dr(a.did).pkg});
var avg=pk.length?(pk.reduce(function(x,y){return x+y},0)/pk.length).toFixed(1):"0";
var hi=pk.length?Math.max.apply(null,pk):0;
function rate(rows){return bar(rows.map(function(r){return[r[0],r[1]?Math.round(r[2]/r[1]*100):0]}),"%")}
var fun=[["Applied",A.length],["Shortlisted+",A.filter(function(a){return a.st>=1&&a.st<4}).length],["Interview+",A.filter(function(a){return a.st==2||a.st==3}).length],["Selected",off.length]];
var br=BR.map(function(b){var s=S.filter(function(u){return u.branch==b});return[b,s.length,s.filter(function(u){return placed[u.id]}).length]}).filter(function(r){return r[1]});
var cb=[["Below 7",0,7],["7 to 8",7,8],["8 and above",8,11]].map(function(b){var s=S.filter(function(u){return u.cgpa>=b[1]&&u.cgpa<b[2]});return[b[0],s.length,s.filter(function(u){return placed[u.id]}).length]});
var pb=[["Below 6 LPA",pk.filter(function(p){return p<6}).length],["6 to 9 LPA",pk.filter(function(p){return p>=6&&p<9}).length],["9 LPA and above",pk.filter(function(p){return p>=9}).length]];
var rec=db.drives.map(function(d){return[d.co,A.filter(function(a){return a.did==d.id}).length]}).sort(function(a,b){return b[1]-a[1]}).slice(0,5);
var none='<div class="meta">Not enough data yet.</div>';
return '<div class="grid stats">'+stat(S.length?Math.round(np/S.length*100)+"%":"0%","Placement rate")+stat("₹"+avg+" LPA","Average package")+stat("₹"+hi+" LPA","Highest package")+stat(off.length,"Offers made")+'</div>'+
'<div class="tools"><button class="btn g" data-act="demo">Load demo data</button><button class="btn d" data-act="cleardemo">Clear demo data</button></div>'+
'<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">'+
'<div class="card"><h2>Hiring funnel</h2>'+(A.length?bar(fun):none)+'</div>'+
'<div class="card"><h2>Placement rate by branch</h2>'+(br.length?rate(br):none)+'</div>'+
'<div class="card"><h2>Placement rate by CGPA band</h2>'+(S.length?rate(cb):none)+'</div>'+
'<div class="card"><h2>Offers by package</h2>'+(off.length?bar(pb):none)+'</div>'+
'<div class="card"><h2>Top drives by applications</h2>'+(A.length?bar(rec):none)+'</div></div>'}

function demo(){
var N=["Aarav","Riya","Kabir","Neha","Isha","Rohan","Meera","Arjun","Sana","Vikram","Tanya","Dev","Anaya","Karan","Pooja","Yash","Diya","Manav","Simran","Harsh"];
for(var i=0;i<N.length;i++){var c=Math.round((6+((i*37)%38)/10)*100)/100,u={id:"demo"+i,role:"student",name:N[i]+" (demo)",roll:"DEMO"+(100+i),branch:BR[i%BR.length],cgpa:c,email:"demo"+i+"@example.com",pw:"demo123"};
if(us(u.id))continue;db.users.push(u);
db.drives.filter(function(d){return c>=d.cgpa}).slice(i%2,(i%2)+2).forEach(function(d,j){
var st=c>=8.5?3:c>=7.5?(i%2?3:2):c>=6.8?((i+j)%3):((i+j)%2?4:0);
db.apps.push({id:"demoa"+i+"_"+j,uid:u.id,did:d.id,st:st,on:today()})})}
save()}

function route(){
me=us(sess());var h=location.hash||"#/",v;
if(h=="#/dashboard"){if(!me){location.hash="#/login";return}v=me.role=="admin"?admin():student()}
else if(h=="#/login"){v=me?(location.hash="#/dashboard",""):login()}
else if(h=="#/register"){v=me?(location.hash="#/dashboard",""):register()}
else v=landing();
nav();$("app").innerHTML=v}

document.addEventListener("click",function(e){var t=e.target,g=function(k){return t.getAttribute&&t.getAttribute(k)};
if(g("data-tab")){tab=g("data-tab");route()}
else if(g("data-act")=="out"){setSess(null);tab="";location.hash="#/";route()}
else if(g("data-apply")){var id=g("data-apply");if(!db.apps.some(function(a){return a.uid==me.id&&a.did==id})){db.apps.push({id:uid(),uid:me.id,did:id,st:0,on:today()});save();route();toast("Application submitted")}}
else if(g("data-del")){if(confirm("Delete this drive and its applications?")){var x=g("data-del");db.drives=db.drives.filter(function(d){return d.id!=x});db.apps=db.apps.filter(function(a){return a.did!=x});save();route();toast("Drive deleted")}}
else if(g("data-act")=="demo"){demo();route();toast("Demo data loaded")}
else if(g("data-act")=="cleardemo"){db.users=db.users.filter(function(u){return String(u.id).indexOf("demo")!=0});db.apps=db.apps.filter(function(a){return String(a.uid).indexOf("demo")!=0});save();route();toast("Demo data cleared")}
else if(g("data-act")=="csv"){var r=[["Student","Roll","Branch","CGPA","Email","Company","Role","Status"]];
db.apps.forEach(function(a){var u=us(a.uid),d=dr(a.did);if(u&&d)r.push([u.name,u.roll,u.branch,u.cgpa,u.email,d.co,d.role,STAGES[a.st]])});
var csv=r.map(function(x){return x.map(function(c){c=String(c);if(/^[=+\-@]/.test(c))c="'"+c;return '"'+c.replace(/"/g,'""')+'"'}).join(",")}).join("\n");
var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="applicants.csv";a.click()}});
document.addEventListener("change",function(e){var t=e.target,s=t.getAttribute("data-st");
if(s){db.apps.forEach(function(a){if(a.id==s)a.st=+t.value});save();route();toast("Status updated")}
else if(t.id=="ft"){F.t=t.value;route()}else if(t.id=="fe"){F.e=t.value;route()}});
document.addEventListener("input",function(e){if(e.target.id=="fq"){F.q=e.target.value;route();var q=$("fq");q.focus();q.setSelectionRange(q.value.length,q.value.length)}});
document.addEventListener("submit",function(e){e.preventDefault();var id=e.target.id,v=function(i){return $(i).value.trim()},er=function(m){$("er").textContent=m};
if(id=="lf"){var u=db.users.filter(function(x){return x.email==v("le").toLowerCase()&&x.pw==$("lp").value})[0];
if(!u)return er("Incorrect email or password.");setSess(u.id);tab="";location.hash="#/dashboard";route()}
else if(id=="rf"){var em=v("re").toLowerCase();if(db.users.some(function(x){return x.email==em}))return er("This email is already registered.");
var n={id:uid(),role:"student",name:v("rn"),roll:v("rr"),branch:$("rb").value,cgpa:+v("rc"),email:em,pw:$("rp").value};
db.users.push(n);save();setSess(n.id);tab="";location.hash="#/dashboard";route();toast("Welcome to PlaceMate!")}
else if(id=="pf"){me.name=v("pn");me.roll=v("pr");me.branch=$("pb").value;me.cgpa=+v("pc");me.phone=v("pp");me.resume=v("pl");save();route();toast("Profile saved")}
else if(id=="nf"){db.drives.unshift({id:uid(),co:v("nc"),role:v("nr"),pkg:+v("np"),cgpa:+v("ng"),type:$("nt").value,dl:v("nd")});save();route();toast("Drive published")}});
window.addEventListener("hashchange",function(){tab="";route()});
load();route();
</script>
</body>
